<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="description" content="Through The Room coming soon page">
  <title>Coming Soon | Through The Room</title>
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
  <main class="site-page landing-page">
    <header class="top-controls">
      <button
        class="drawer-button"
        id="menuButton"
        type="button"
        aria-label="Open navigation menu"
        aria-controls="sideMenu"
        aria-expanded="false"
      >
        <img src="assets/BuddhaLogo.png?v=6" alt="" aria-hidden="true">
      </button>

      <button class="bag-button" type="button" aria-label="Shopping bag, 0 items">
        <span class="bag-handle" aria-hidden="true"></span>
        <span class="bag-body" aria-hidden="true"></span>
        <span class="bag-count">0</span>
      </button>
    </header>

    <a
      class="instagram-button"
      href="https://www.instagram.com/throughtheroom?igsh=eTV3cHYxdTh2Z2xp"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open Through The Room on Instagram"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <circle cx="12" cy="12" r="4.25"></circle>
        <circle class="instagram-dot" cx="17.4" cy="6.7" r="1"></circle>
      </svg>
    </a>

    <div class="center-brand">
      <h1 class="page-heading">Coming soon</h1>
    </div>

    <aside class="side-menu" id="sideMenu" aria-hidden="true">
      <button
        class="close-button"
        id="closeButton"
        type="button"
        aria-label="Close navigation menu"
      >
        <span aria-hidden="true">×</span>
      </button>

      <nav class="side-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="gallery.html">Gallery</a>
        <a href="coming-soon.html" aria-current="page">Coming soon</a>
      </nav>
    </aside>

    <button
      class="menu-overlay"
      id="menuOverlay"
      type="button"
      aria-label="Close navigation menu"
      hidden
    ></button>
  </main>

  <script src="script.js?v=6"></script>
</body>
</html>
