<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="description" content="Through The Room gallery page">
  <title>Gallery | Through The Room</title>
  <link rel="stylesheet" href="styles.css?v=9">
  <link rel="stylesheet" href="gallery.css?v=23">
  <link rel="preload" as="image" href="assets/magazine-dim-1.png?v=2">
  <link rel="preload" as="image" href="assets/magazine-dim-2.png?v=2">
  <link rel="preload" as="image" href="assets/magazine-dim-3.png?v=2">
  <link rel="preload" as="image" href="assets/magazine-dim-4.png?v=2">
</head>
<body>
  <main class="site-page landing-page gallery-page">
    <header class="top-controls">
      <button
        class="drawer-button"
        id="menuButton"
        type="button"
        aria-label="Open navigation menu"
        aria-controls="sideMenu"
        aria-expanded="false"
      >
        <img src="assets/BuddhaLogo.png?v=6" alt="" aria-hidden="true">
      </button>
    </header>

    <a
      class="instagram-button"
      href="https://www.instagram.com/throughtheroom?igsh=eTV3cHYxdTh2Z2xp"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open Through The Room on Instagram"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <circle cx="12" cy="12" r="4.25"></circle>
        <circle class="instagram-dot" cx="17.4" cy="6.7" r="1"></circle>
      </svg>
    </a>

    <section class="gallery-stage" aria-label="Gallery">
      <button class="comic-back" type="button" hidden>← All panels</button>
      <button class="comic-exit" type="button" aria-label="Exit gallery" hidden>×</button>
      <div class="gallery-comic">
        <p class="comic-hint" hidden>Click each section to learn more about Through The Room</p>
        <div class="comic-book">
          <div class="comic-page" id="comicPage" aria-hidden="true" inert>
            <img
              src="assets/TTR-magazine.jpg"
              alt="Four-panel Through The Room clothing photo collage framed by neon green lightning"
              width="1600"
              height="1138"
            >
            <div class="comic-panels">
              <button class="comic-panel" type="button" data-x="0" data-y="0" data-size="46" aria-label="Zoom into the headphones panel"></button>
              <button class="comic-panel" type="button" data-x="54" data-y="0" data-size="46" aria-label="Zoom into the desert portrait panel"></button>
              <button class="comic-panel" type="button" data-x="0" data-y="51" data-size="48" aria-label="Zoom into the Joshua tree panel"></button>
              <button class="comic-panel" type="button" data-x="54" data-y="54" data-size="46" aria-label="Zoom into the forest portrait panel"></button>
            </div>
          </div>
          <div class="comic-cover" id="comicCover">
            <div class="comic-cover-art">
              <div class="comic-exhibit-frame">
                <img src="assets/TTRLogo.png?v=6" alt="Through The Room">
              </div>
              <span class="comic-exhibit-label" aria-hidden="true"></span>
              <div class="comic-exhibit-frame comic-exhibit-reflection" aria-hidden="true">
                <img src="assets/TTRLogo.png?v=6" alt="">
              </div>
            </div>
          </div>
        </div>
        <button class="comic-turn" type="button" aria-controls="comicPage" aria-expanded="false">
          <span class="comic-turn-label">Open magazine</span> <span aria-hidden="true">→</span>
        </button>
      </div>
    </section>

    <aside class="side-menu" id="sideMenu" aria-hidden="true">
      <button
        class="close-button"
        id="closeButton"
        type="button"
        aria-label="Close navigation menu"
      >
        <span aria-hidden="true">×</span>
      </button>

      <nav class="side-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="gallery.html" aria-current="page">Gallery</a>
        <a href="coming-soon.html">Coming soon</a>
      </nav>
    </aside>

    <button
      class="menu-overlay"
      id="menuOverlay"
      type="button"
      aria-label="Close navigation menu"
      hidden
    ></button>
  </main>

  <script src="script.js?v=6"></script>
  <script src="gallery.js?v=5"></script>
</body>
</html>
